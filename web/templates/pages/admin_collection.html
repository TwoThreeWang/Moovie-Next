{{define "content"}}<main class="admin">{{template "admin_nav" .}}
<section class="card-panel"><h2>{{if .Collection.ID}}编辑片单{{else}}新建片单{{end}}</h2>
<form class="form" method="post" action="/admin/collections">{{template "csrf" .CSRF}}<input type="hidden" name="id" value="{{.Collection.ID}}">
<label>标题<input name="title" value="{{.Collection.Title}}" maxlength="80" required></label>
<label>地址<input name="slug" value="{{.Collection.Slug}}" pattern="[a-z0-9][a-z0-9-]{1,60}" required><small>只能用小写字母、数字和连字符，例如 best-of-2026</small></label>
<label>简介<textarea name="description" rows="3" maxlength="1000">{{.Collection.Description}}</textarea></label>
<label class="switch"><input type="checkbox" name="featured"{{if .Collection.Featured}} checked{{end}}><span>精选（排在前面，并出现在首页）</span></label>
<label>作品<textarea name="items" rows="12" spellcheck="false" placeholder="每行一部：作品 ID | 片名（仅供阅读）| 备注">{{.ItemsText}}</textarea><small>作品 ID 是作品详情页地址 /m/ 后面的数字。顺序就是展示顺序。</small></label>
<div class="form-actions"><a class="btn btn-glass" href="/admin/collections">返回</a><button class="btn btn-primary">保存</button></div></form></section>
</main>{{end}}
