{{define "content"}}<main class="admin">{{template "admin_nav" .}}
<div class="pad admin-tools"><a class="btn btn-primary" href="/admin/collections/new">新建片单</a></div>
<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>片单</th><th>地址</th><th>作品数</th><th>更新</th><th></th></tr></thead><tbody>
{{range .Collections}}<tr><td>{{.ID}}</td><td><a href="/admin/collections/{{.ID}}">{{.Title}}</a>{{if .Featured}} <span class="tag">精选</span>{{end}}</td><td><a href="/list/{{.Slug}}">/list/{{.Slug}}</a></td><td>{{.Count}}</td><td>{{date .UpdatedAt}}</td>
<td><form method="post" action="/admin/collections/{{.ID}}/delete" class="inline-form" data-confirm="删除片单《{{.Title}}》？">{{template "csrf" $.CSRF}}<button class="link danger">删除</button></form></td></tr>
{{else}}<tr><td colspan="6" class="empty">还没有片单</td></tr>{{end}}</tbody></table></div>
</main>{{end}}
