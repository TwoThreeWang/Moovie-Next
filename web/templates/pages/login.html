{{define "content"}}<main class="auth">
<a class="nav-brand" href="/"><img class="brand-icon" src="/static/img/apple-touch-icon.png" width="40" height="40" alt=""><span class="brand-t">{{.Site}}</span></a>
<form class="form auth-card" method="post" action="/auth/login" data-pow data-login>
{{if .PoW}}<input type="hidden" name="pow_token" value="{{.PoW}}"><input type="hidden" name="pow_nonce" value="">
<noscript><p class="flash error">登录需要开启 JavaScript（用于安全校验）。</p></noscript>{{end}}
<h1>登录</h1>
{{if .Error}}<p class="flash error" role="alert">{{.Error}}</p>{{end}}
<input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="redirect" value="{{.Redirect}}">
<label>邮箱<input type="email" name="email" value="{{.Email}}" autocomplete="email" inputmode="email" required{{if not .Email}} autofocus{{end}}></label>
<label>密码<input type="password" name="password" autocomplete="current-password" required{{if .Email}} autofocus{{end}}></label>
<button class="btn btn-primary">登录</button>
<p class="hint">还没有账号？<a href="/auth/register">注册</a> · <a href="/auth/forgot">忘记密码</a></p>
</form></main>{{end}}
