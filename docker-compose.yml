# docker compose up -d --build；数据库、Ollama、WARP 使用 postgres_default 网络里的已有服务，
# 豆瓣代理 mihomo 使用 mihomo_default 网络里的已有服务（两个网络都要先存在）。
# 根目录 .env 是唯一配置入口；这里只做各容器的变量映射，说明见 docs/deploy.md。
x-proxy-env: &proxy-env
  HTTP_PROXY: "${HTTP_PROXY-${OUTBOUND_PROXY-}}"
  HTTPS_PROXY: "${HTTPS_PROXY-${OUTBOUND_PROXY-}}"
  NO_PROXY: "${NO_PROXY-}"

x-app-env: &app-env
  <<: *proxy-env
  APP_ENV: "${APP_ENV:-production}"
  JOBS_IN_WEB: "${JOBS_IN_WEB:-false}"

x-runtime: &runtime
  restart: unless-stopped
  networks: [postgres_default]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-app: &app
  <<: *runtime
  # 网站和 worker 额外加入 mihomo 的网络，DOUBAN_PROXY=http://mihomo:7890 才能连上；弹幕服务不需要。
  networks: [postgres_default, mihomo_default]
  image: moovie:local
  env_file: .env
  stop_grace_period: 20s
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  volumes:
    - ./data:/app/data:ro

services:
  web:
    <<: *app
    build: .
    container_name: moovie-web
    environment:
      <<: *app-env
      PORT: "${PORT:-5007}"
      DB_MAX_CONNS: "${WEB_DB_MAX_CONNS:-${DB_MAX_CONNS:-12}}"
      GOMEMLIMIT: "${WEB_GO_MEMORY_LIMIT:-${GOMEMLIMIT:-400MiB}}"
    ports:
      - "${WEB_BIND:-127.0.0.1}:${PORT:-5007}:${PORT:-5007}"
    mem_limit: "${WEB_MEMORY_LIMIT:-2048m}"
    cpus: "${WEB_CPU_LIMIT:-2.0}"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${PORT:-5007}/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    container_name: moovie-worker
    entrypoint: ["./worker"]
    environment:
      <<: *app-env
      DB_MAX_CONNS: "${WORKER_DB_MAX_CONNS:-${DB_MAX_CONNS:-6}}"
      GOMEMLIMIT: "${WORKER_GO_MEMORY_LIMIT:-${GOMEMLIMIT:-200MiB}}"
    mem_limit: "${WORKER_MEMORY_LIMIT:-1024m}"
    cpus: "${WORKER_CPU_LIMIT:-1.5}"
    pids_limit: 128

  # 只供网站内网调用，不对外开端口，也不加载含数据库、邮件等密钥的 .env。
  danmu-api:
    <<: *runtime
    image: logvar/danmu-api:latest
    container_name: moovie-danmu
    environment:
      <<: *proxy-env
      TOKEN: "${TOKEN-${DANMU_API_TOKEN:-changeme}}"
      # 所有请求来自网站的内网 IP，访客限流由网站负责。
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-0}"
      COMMENT_CACHE_MINUTES: "${COMMENT_CACHE_MINUTES:-60}"
      SEARCH_CACHE_MINUTES: "${SEARCH_CACHE_MINUTES:-30}"
      DANMU_LIMIT: "${DANMU_LIMIT:-5}"
      LIKE_SWITCH: "${LIKE_SWITCH:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./data/danmu-cache:/app/.cache
    mem_limit: "${DANMU_MEMORY_LIMIT:-512m}"

networks:
  postgres_default:
    external: true
  mihomo_default:
    external: true
