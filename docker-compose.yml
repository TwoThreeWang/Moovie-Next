# docker compose up -d --build；数据库、Ollama、WARP 使用 postgres_default 网络里的已有服务。
# 环境变量从宿主机的 .env 和 deploy/*.env 读取，配置说明见 deploy/README.md。
x-runtime: &runtime
  restart: unless-stopped
  networks: [postgres_default]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-app: &app
  <<: *runtime
  image: moovie:local
  stop_grace_period: 20s
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  volumes:
    - ./data:/app/data:ro

services:
  web:
    <<: *app
    build: .
    container_name: moovie-web
    env_file: [.env, ./deploy/web.env]
    ports:
      - "${WEB_BIND:-127.0.0.1}:5008:5008"
    mem_limit: "${WEB_MEMORY_LIMIT:-512m}"
    cpus: "${WEB_CPU_LIMIT:-2.0}"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5008/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    container_name: moovie-worker
    entrypoint: ["./worker"]
    env_file: [.env, ./deploy/worker.env]
    mem_limit: "${WORKER_MEMORY_LIMIT:-256m}"
    cpus: "${WORKER_CPU_LIMIT:-1.0}"
    pids_limit: 128

  # 只供网站内网调用，不对外开端口，也不加载含数据库、邮件等密钥的 .env。
  danmu-api:
    <<: *runtime
    image: logvar/danmu-api:latest
    container_name: moovie-danmu
    env_file: ./deploy/danmu.env
    volumes:
      - ./data/danmu-cache:/app/.cache
    mem_limit: 512m

networks:
  postgres_default:
    external: true
