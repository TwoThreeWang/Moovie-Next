# mihomo（Clash.Meta 内核）出站代理：单独的容器，单独的网络，不动宿主机的网络。
#
# - 不用 host 网络、不建 TUN 网卡、不要额外权限（cap_add），只是一个普通的 HTTP / SOCKS5 代理进程。
# - 不向宿主机开放端口；只有加入 moovie-egress 这个网络的容器能用它：http://mihomo:7890
#   （需要在宿主机上调试时，可以临时打开下面 ports 那一行，只绑 127.0.0.1）。
#
# 启动：
#   cp deploy/mihomo/config.yaml.example deploy/mihomo/config.yaml   # 填好订阅链接
#   docker compose -f deploy/mihomo/docker-compose.yml up -d
#
# 别的容器要用它（比如网站和 worker）：在它们的 compose 文件里加
#   networks:
#     moovie-egress:
#       external: true
# 并在服务里写 networks: [default, moovie-egress]，环境变量 DOUBAN_PROXY=http://mihomo:7890
name: moovie-egress

services:
  mihomo:
    image: metacubex/mihomo:latest   # 上线后建议固定成测试过的版本号
    container_name: mihomo
    restart: unless-stopped
    volumes:
      - ./:/root/.config/mihomo       # config.yaml 和订阅节点的缓存
    networks: [moovie-egress]
    # ports:
    #   - "127.0.0.1:7890:7890"
    mem_limit: 256m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  moovie-egress:
    name: moovie-egress   # 固定名字，别的 compose 项目可以用 external: true 加入
    driver: bridge
